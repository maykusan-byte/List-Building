name: Validate Warforge

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the browser used by both applications
        run: pnpm --dir warforge-layouts exec playwright install --with-deps chromium
      - name: Verify generated data, tests and production build
        run: pnpm verify
      - name: Verify GitHub Pages build
        run: pnpm --dir warforge-pwa build:pages
      - name: Verify layout viewer
        run: |
          pnpm --dir warforge-layouts test
          pnpm --dir warforge-layouts build:pages
          pnpm --dir warforge-layouts test:browser
          node warforge-layouts/scripts/assemble-pages.mjs
          node warforge-layouts/scripts/check-pages.mjs
      - name: Ensure generated artifacts are committed
        run: git diff --exit-code
